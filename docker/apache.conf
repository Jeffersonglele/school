ServerName localhost
ServerTokens Prod
ServerSignature Off

# Page d'accueil : le projet n'a pas d'index.php, on démarre sur la connexion.
DirectoryIndex connexion.php index.php index.html

# Derrière le proxy de Render (HTTPS terminé en amont), PHP doit savoir
# que la requête d'origine était en HTTPS ($_SERVER['HTTPS']).
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"

# Filet de sécurité : jamais de fichiers techniques servis par le web.
<FilesMatch "\.(sql|sh|ini|lock|md|log|env|dist)$|^composer\.json$|^Dockerfile$">
    Require all denied
</FilesMatch>
