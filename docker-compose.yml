# Test local : docker compose up --build   puis   http://localhost:8080
# Les valeurs ci-dessous sont des réglages LOCAUX jetables ; en production (Render)
# les variables viennent du tableau de bord / render.yaml, jamais de ce fichier.
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: projet1
      MARIADB_USER: school
      MARIADB_PASSWORD: ${DB_PASSWORD:-school_local_pwd}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_pwd}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      PORT: ${APP_PORT:-8080}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: projet1
      DB_USERNAME: school
      DB_PASSWORD: ${DB_PASSWORD:-school_local_pwd}
      FEDAPAY_API_KEY: ${FEDAPAY_API_KEY:-}
      FEDAPAY_ENVIRONMENT: ${FEDAPAY_ENVIRONMENT:-sandbox}
      APP_DEBUG: "1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${APP_PORT:-8080}/healthz.php?db=1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data:
